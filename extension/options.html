<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Tincan History: site access</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; min-width: 360px; color: #1f1f1f; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: #444; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #e3e3e3; }
  .label { flex: 1; font-weight: 600; }
  .status { color: #5f6368; }
  .status.granted { color: #137333; }
  .status.partial { color: #b06000; }
  @media (prefers-color-scheme: dark) {
    body { color: #e3e3e3; background: #202124; }
    p, .status { color: #bdc1c6; }
    li { border-top-color: #3c4043; }
    .status.granted { color: #81c995; }
    .status.partial { color: #fdd663; }
  }
</style>
</head>
<body>
<h1>Site access</h1>
<p>Agent Tincan reads and sends only on sites Chrome has granted it. Grant a site here before its web agent or history reads can use it; Chrome asks you to confirm.</p>
<ul id="sites"></ul>
<script type="module" src="options.js"></script>
</body>
</html>
